services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-task-manager:1.0
    container_name: taskmanager-app
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?Isi MYSQL_DATABASE di file .env}
      DB_USER: ${MYSQL_USER:?Isi MYSQL_USER di file .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Isi MYSQL_PASSWORD di file .env}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Isi APP_SECRET_KEY di file .env}
    ports:
      - "80:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  database:
    image: mysql:8.4
    container_name: taskmanager-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di file .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Isi MYSQL_DATABASE di file .env}
      MYSQL_USER: ${MYSQL_USER:?Isi MYSQL_USER di file .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Isi MYSQL_PASSWORD di file .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
